name: Sync Trioland site images
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-site-images.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download approved source images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trioland site/assets
          curl -fL --retry 3 'https://drive.usercontent.google.com/download?id=1O87r8RVuc6U1ABvsWfAEkKuefs0HVuGM&export=download' -o /tmp/trioland/ume-source
          curl -fL --retry 3 'https://drive.usercontent.google.com/download?id=1jiXg1imGUyH1LnCmcRpuXqiKcd9t3CQa&export=download' -o /tmp/trioland/koma1-source
          curl -fL --retry 3 'https://drive.usercontent.google.com/download?id=1LV-8iLFvMe_7ljpMnkXcFkT5_AX0rkkG&export=download' -o /tmp/trioland/koma2-source
          test $(stat -c%s /tmp/trioland/ume-source) -gt 100000
          test $(stat -c%s /tmp/trioland/koma1-source) -gt 100000
          test $(stat -c%s /tmp/trioland/koma2-source) -gt 100000

      - name: Prepare high quality web images
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          def open_rgb(path):
              im = Image.open(path)
              im.load()
              return im.convert('RGB')

          # 梅ヶ丘園: 元画像の解像度を保ちながらWeb向けに最適化。
          im = open_rgb('/tmp/trioland/ume-source')
          im.thumbnail((1800, 1400), Image.Resampling.LANCZOS)
          im.save('site/assets/umegaoka-hq.jpg', 'JPEG', quality=92, optimize=True, progressive=True)

          # 駒沢大学園: 園生活写真。下部テキストを除き4:3にトリミング。
          im = open_rgb('/tmp/trioland/koma1-source')
          w, h = im.size
          target_h = min(int(w * 3 / 4), h)
          y0 = min(max(int(h * 0.10), 0), max(h - target_h, 0))
          im = im.crop((0, y0, w, y0 + target_h))
          im = im.resize((1400, 1050), Image.Resampling.LANCZOS)
          im.save('site/assets/komazawa-life-1.jpg', 'JPEG', quality=90, optimize=True, progressive=True)

          # 駒沢大学園の別カット（詳細ページ用）。
          im = open_rgb('/tmp/trioland/koma2-source')
          im = ImageOps.fit(im, (1400, 1050), method=Image.Resampling.LANCZOS, centering=(0.5, 0.55))
          im.save('site/assets/komazawa-life-2.jpg', 'JPEG', quality=90, optimize=True, progressive=True)

          for p in [
              'site/assets/umegaoka-hq.jpg',
              'site/assets/komazawa-life-1.jpg',
              'site/assets/komazawa-life-2.jpg',
          ]:
              f = Path(p)
              print(p, f.stat().st_size, Image.open(f).size)
              assert f.stat().st_size > 50000
          PY

      - name: Commit site images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/umegaoka-hq.jpg site/assets/komazawa-life-1.jpg site/assets/komazawa-life-2.jpg
          if git diff --cached --quiet; then
            echo 'Images are already current.'
            exit 0
          fi
          git commit -m 'Add high-quality Umegaoka and Komazawa site photos'
          git push
