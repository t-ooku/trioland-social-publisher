# Google Drive にある高解像度の元写真を site/assets/photos/source/ に取り込む。
#
# バイナリをテキストのコミット API 経由で入れると壊れる（過去に 15,000 バイトで
# 切り詰められた JPEG がコミットされ、本番が broken-image になった）ので、
# 元写真は必ずこのワークフローか git push で入れること。
#
# 取り込んだ後、実際にページで使う Web 用サイズは tools/build_photos.py が生成する。
name: Sync Trioland source photos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-site-images.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download source images from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/src
          dl() {
            curl -fL --retry 3 "https://drive.usercontent.google.com/download?id=$1&export=download" -o "$2"
            s=$(stat -c%s "$2")
            echo "$2 -> $s bytes"
            test "$s" -gt 100000 || { echo "too small: Drive returned an HTML page, not an image"; head -c 300 "$2"; exit 1; }
          }
          dl '1O87r8RVuc6U1ABvsWfAEkKuefs0HVuGM' /tmp/src/a
          dl '1jiXg1imGUyH1LnCmcRpuXqiKcd9t3CQa' /tmp/src/b
          dl '1LV-8iLFvMe_7ljpMnkXcFkT5_AX0rkkG' /tmp/src/c

      - name: Store at full resolution
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p site/assets/photos/source
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          # ファイルIDと中身の対応は旧ワークフローのコメント由来で未検証なため、
          # ここでは園名を名前に入れず a / b / c のまま保存する。
          # どの写真がどの園かは目視で確認してから割り当てること。
          for src, name in [('/tmp/src/a', 'a'), ('/tmp/src/b', 'b'), ('/tmp/src/c', 'c')]:
              im = Image.open(src)
              im.load()
              im = ImageOps.exif_transpose(im).convert('RGB')
              out = Path(f'site/assets/photos/source/{name}.jpg')
              im.save(out, 'JPEG', quality=95, optimize=True, progressive=True, subsampling=0)
              chk = Image.open(out); chk.load()
              print(name, im.size, '->', out, out.stat().st_size, 'bytes')
              assert out.stat().st_size > 80000, out
          PY

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/photos/source/
          if git diff --cached --quiet; then echo 'sources already current'; exit 0; fi
          git commit -m 'Store high-resolution Trioland source photos'
          git push
