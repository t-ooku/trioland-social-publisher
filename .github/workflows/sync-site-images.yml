# Google Drive にある元写真から site/assets/photos/*.webp を生成してコミットする。
#
# 前提：対象ファイルが Drive で「リンクを知っている全員が閲覧可」になっていること。
#       非公開のままだと Drive が HTML のログインページを返すため、サイズ検証で
#       失敗して止まる（壊れた画像はコミットされない）。
#
# なぜこの経路なのか：
#   バイナリをテキストのコミット API 経由で入れると壊れる。過去に
#   site/assets/umegaoka.jpg などが「ちょうど15,000バイトで切り詰められた
#   壊れた JPEG」としてコミットされ、本番が broken-image になっていた。
#   画像は必ずこのワークフローか git push で入れること。
#
# 画質の方針：
#   元写真は 1200x900 〜 1666x982。表示枠（site.css で 400〜560px）の
#   2倍前後に収まるよう 760〜1100px で書き出す。引き伸ばしは一切しない。
#
# 焼き込みテロップ：
#   素材は Instagram 投稿用のフレームで、下部（一部は上部にも）に字幕が
#   焼き込まれている。CROP の座標はその帯を実測して決めたもの。動かさないこと。
name: Sync site photos from Drive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-site-images.yml']

permissions:
  contents: write

concurrency:
  group: sync-site-photos
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download originals from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/src
          dl() {
            curl -fsSL --retry 3 \
              "https://drive.usercontent.google.com/download?id=$1&export=download&confirm=t" -o "/tmp/src/$2"
            s=$(stat -c%s "/tmp/src/$2")
            echo "$2 <- $1 : $s bytes"
            if [ "$s" -lt 50000 ]; then
              echo "---- too small: Drive returned a page, not an image ----"
              head -c 400 "/tmp/src/$2" || true
              echo
              echo "Drive のファイルが「リンクを知っている全員」になっているか確認してください。"
              exit 1
            fi
          }
          dl 1O87r8RVuc6U1ABvsWfAEkKuefs0HVuGM umegaoka-exterior
          dl 1CLcvw3TAr2ryaFbXB3pn4soCeNItew1R koma-nature-1
          dl 1FtOwi0Giwjv396YaQz3QfqKSCkrr1Zja koma-nature-2
          dl 1RdrQTvRupCEcvTOv7wfmNRxLHAUSuA7L koma-nature-3
          dl 1RmgrdK-YLCHcc-qJAsaKSgTWfkkuWQlD koma-room-1
          dl 1TaEWEmgsfj06Mb6QEOQdPvFCfSfaEoxg koma-room-2
          dl 1nuspJ-3WKh_jZP5A_g8Ez_3F-zCDgpqA koma-room-3
          dl 1dlX2jVRZIBdznMhSsK37qOrJ1ZT0jBtS koma-craft
          dl 1jiXg1imGUyH1LnCmcRpuXqiKcd9t3CQa koma-water

      - name: Build web images
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p site/assets/photos
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          # name, expected source size, crop box (焼き込みテロップの除去), output width, quality
          PLAN = [
              ("umegaoka-exterior", (1666,  982), None,                 1100, 80),
              ("koma-nature-1",     (1200,  900), (0,   0, 1200,  680),  880, 80),
              ("koma-nature-2",     (1200,  900), (0,   0, 1200,  680),  880, 80),
              ("koma-nature-3",     (1200,  900), (0,   0, 1200,  655),  880, 80),
              ("koma-room-1",       (1200, 1200), (0, 150, 1200,  950),  880, 80),
              ("koma-room-2",       (1200, 1200), (0, 150, 1200,  950),  880, 80),
              ("koma-room-3",       (1200, 1200), (0, 150, 1200,  950),  880, 80),
              ("koma-craft",        (1110, 1474), None,                  760, 80),
              ("koma-water",        (1170, 2064), (0,   0, 1170, 1700),  760, 80),
          ]

          for name, expect, box, width, q in PLAN:
              im = Image.open(f"/tmp/src/{name}")
              im.load()
              im = ImageOps.exif_transpose(im).convert("RGB")
              if im.size != expect:
                  raise SystemExit(f"{name}: expected {expect}, got {im.size} - wrong file?")
              if box:
                  im = im.crop(box)
              if im.width > width:
                  im = im.resize((width, round(width * im.height / im.width)), Image.LANCZOS)
              out = Path(f"site/assets/photos/{name}.webp")
              im.save(out, "WEBP", quality=q, method=6)
              chk = Image.open(out); chk.load()          # full decode guard
              print(f"{name:20s} {chk.size}  {out.stat().st_size//1024}KB")
              assert out.stat().st_size > 15000, out
          PY

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/photos/
          if git diff --cached --quiet; then echo 'photos already current'; exit 0; fi
          git commit -m 'Add high-resolution Trioland site photos'
          git push
