name: Trioland site smoke
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait until Cloudflare serves latest site
        shell: bash
        run: |
          set -euo pipefail
          base='https://trioland-social-publisher.mygate-jp.workers.dev'
          ok=0
          for i in $(seq 1 24); do
            echo "attempt $i"
            if curl -fsSL "$base/?v=20260910-1645" -o /tmp/index.html && grep -q 'photo-loader.js?v=20260910-1638' /tmp/index.html; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          echo 'latest home detected'
      - name: Verify photo payload and all public pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://trioland-social-publisher.mygate-jp.workers.dev'
          curl -fsSL "$base/assets/photo-loader.js?v=20260910-1645" -o /tmp/photo-loader.js
          grep -q 'photos-b64-v5' /tmp/photo-loader.js
          echo 'photo loader OK'
          : > /tmp/photos.b64
          for p in 00 01 02 03 04; do
            curl -fsSL "$base/assets/photos-b64-v5/$p.txt?v=20260910-1645" -o "/tmp/$p.txt"
            echo "$p $(wc -c < /tmp/$p.txt) bytes"
            cat "/tmp/$p.txt" >> /tmp/photos.b64
          done
          base64 -d /tmp/photos.b64 > /tmp/photos.webp
          size=$(stat -c%s /tmp/photos.webp)
          echo "decoded image bytes: $size"
          test "$size" -gt 30000
          file /tmp/photos.webp
          fail=0
          for page in komazawa.html umegaoka.html recruit.html faq.html column.html contact.html; do
            curl -fsSL "$base/$page?v=20260910-1645" -o "/tmp/$page"
            if grep -q 'photo-loader.js?v=20260910-1638' "/tmp/$page"; then
              echo "$page OK"
            else
              echo "$page MISSING LOADER"
              fail=1
            fi
          done
          exit "$fail"
      - name: Verify photos render in a real browser
        shell: bash
        run: |
          set -euo pipefail
          base='https://trioland-social-publisher.mygate-jp.workers.dev'
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$chrome"
          "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom "$base/?v=20260910-1645" > /tmp/rendered.html
          grep -q 'blob:' /tmp/rendered.html
          echo 'headless browser confirmed reconstructed photo sprite is applied'
