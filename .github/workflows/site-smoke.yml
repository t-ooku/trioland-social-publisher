name: Trioland site smoke
on:
  # 写真ビルドが終わってから走らせる（画像コミット前に走ると必ず落ちるため）
  workflow_run:
    workflows: ["Build site"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * *' # 08:15 JST
permissions:
  contents: read
  issues: write
concurrency:
  group: trioland-site-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the new build to go live
        shell: bash
        run: |
          set -euo pipefail
          base='https://trioland-social-publisher.mygate-jp.workers.dev'
          for i in $(seq 1 40); do
            if curl -fsSL "$base/" -o /tmp/home && grep -q 'assets/photos/komazawa-exterior.webp' /tmp/home; then
              echo "live"; exit 0
            fi
            sleep 10
          done
          echo "new build did not appear in time"; exit 1

      - name: All pages return 200
        shell: bash
        run: |
          set -euo pipefail
          base='https://trioland-social-publisher.mygate-jp.workers.dev'
          for p in / /komazawa.html /umegaoka.html /contact.html /recruit.html /faq.html /column.html \
                   /recruit/ /robots.txt /sitemap.xml; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$base$p")
            echo "$code $p"
            test "$code" = 200
          done

      - name: Every photo really is a valid image
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          base='https://trioland-social-publisher.mygate-jp.workers.dev'
          for n in komazawa-exterior.webp umegaoka-exterior.webp trioland-logo.webp \
                   life-room.webp life-play.webp life-nature.webp life-table.webp \
                   life-toys.webp life-summer.webp life-water.webp; do
            f=/tmp/$n
            code=$(curl -L -s -o "$f" -w '%{http_code}' "$base/assets/photos/$n")
            test "$code" = 200
            size=$(stat -c%s "$f")
            test "$size" -gt 8000
            file -b "$f" | grep -qiE 'jpeg|web/?p'
            # full decode - this is exactly what caught the truncated 15,000-byte JPEGs
            python3 -c "import sys;from PIL import Image;im=Image.open(sys.argv[1]);im.load();print(sys.argv[1],im.size,'decoded OK')" "$f"
            echo "$n OK ($size bytes)"
          done

      - name: No references to the retired photo pipeline
        shell: bash
        run: |
          set -euo pipefail
          base='https://trioland-social-publisher.mygate-jp.workers.dev'
          for p in / /komazawa.html /umegaoka.html /contact.html /recruit.html /faq.html /column.html; do
            body=$(curl -fsSL "$base$p")
            ! grep -q 'sprite-photo'      <<<"$body"
            ! grep -q 'photo-policy-v2'   <<<"$body"
            ! grep -q 'photos-b64'        <<<"$body"
          done
          echo 'no legacy photo pipeline references'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public Pages and inquiry route (GET only)
        shell: bash
        run: |
          set -euo pipefail
          for base in https://hoiku.triocareer.jp https://afterschool.triocareer.jp; do
            for p in / /recruit.html /contact.html; do
              code=$(curl --max-time 30 -L -s -o /dev/null -w '%{http_code}' "$base$p")
              echo "$code $base$p"
              test "$code" = 200
            done
          done
          code=$(curl --max-time 30 -s -o /dev/null -w '%{http_code}' https://trioland-social-publisher.mygate-jp.workers.dev/api/inquiry)
          echo "inquiry GET status: $code (405 is expected; delivery is not tested)"
          test "$code" = 405
      - name: Recruit article last commit
        shell: bash
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%cI -- site/recruit afterschool/content/column)
          echo "Recruit article last commit: $last" >> "$GITHUB_STEP_SUMMARY"
          test -n "$last"
          python3 - "$last" <<'PY'
          import datetime, sys
          last = datetime.datetime.fromisoformat(sys.argv[1])
          age = (datetime.datetime.now(datetime.timezone.utc) - last).total_seconds()
          print("Recruit last commit age hours:", round(age / 3600, 1))
          if age > 48 * 3600:
              raise SystemExit("Recruit articles have no commit in over 48h")
          PY
      - name: Record failure without duplicate issues
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[AUTO][TRIOLAND] Daily site inspection failed';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open' });
            if (!issues.some(i => !i.pull_request && i.title === title)) {
              await github.rest.issues.create({ owner, repo, title, body: 'Inspection failed. See Actions run: ' + context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId + '\nGET checks only; no inquiries submitted. No personal data included.' });
            }
