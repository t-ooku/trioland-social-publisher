name: Trioland site smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for latest site
        shell: bash
        run: |
          set -euo pipefail
          base='https://trioland-social-publisher.mygate-jp.workers.dev'
          for i in $(seq 1 30); do
            if curl -fsSL "$base/?v=20260910-2235" -o /tmp/home && grep -q 'photo-policy-v2.js?v=20260910-2235' /tmp/home; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Verify nursery images and mobile policy
        shell: bash
        run: |
          set -euo pipefail
          base='https://trioland-social-publisher.mygate-jp.workers.dev'
          curl -fsSL "$base/assets/photo-policy-v2.js?v=20260910-2235" -o /tmp/policy
          grep -q 'umegaoka-hq.jpg' /tmp/policy
          grep -q 'komazawa-life-1.jpg' /tmp/policy
          grep -q 'padding-bottom:108px' /tmp/policy
          for p in /assets/umegaoka-hq.jpg /assets/komazawa-life-1.jpg /assets/komazawa-life-2.jpg; do
            code=$(curl -L -s -o /tmp/img -w '%{http_code}' "$base$p?v=20260910-2235")
            test "$code" = 200
            test $(stat -c%s /tmp/img) -gt 50000
          done
          echo 'Trioland final image assets and mobile CTA policy OK'
