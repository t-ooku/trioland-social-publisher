name: Trioland site smoke
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait until Cloudflare serves latest site
        shell: bash
        run: |
          set -euo pipefail
          base='https://trioland-social-publisher.mygate-jp.workers.dev'
          ok=0
          for i in $(seq 1 24); do
            echo "attempt $i"
            if curl -fsS "$base/?v=20260910-1638" -o /tmp/index.html && grep -q 'photo-loader.js?v=20260910-1638' /tmp/index.html; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          echo 'latest home detected'
      - name: Verify photo payload and all public pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://trioland-social-publisher.mygate-jp.workers.dev'
          curl -fsS "$base/assets/photo-loader.js?v=20260910-1638" -o /tmp/photo-loader.js
          grep -q 'photos-b64-v5' /tmp/photo-loader.js
          echo 'photo loader OK'
          : > /tmp/photos.b64
          for p in 00 01 02 03 04; do
            curl -fsS "$base/assets/photos-b64-v5/$p.txt?v=20260910-1638" -o "/tmp/$p.txt"
            echo "$p $(wc -c < /tmp/$p.txt) bytes"
            cat "/tmp/$p.txt" >> /tmp/photos.b64
          done
          base64 -d /tmp/photos.b64 > /tmp/photos.webp
          size=$(stat -c%s /tmp/photos.webp)
          echo "decoded image bytes: $size"
          test "$size" -gt 30000
          desc=$(file /tmp/photos.webp)
          echo "$desc"
          [[ "$desc" == *"Web/P image"* ]]
          for page in komazawa.html umegaoka.html recruit.html faq.html column.html contact.html; do
            curl -fsS "$base/$page?v=20260910-1638" -o "/tmp/$page"
            grep -q 'photo-loader.js?v=20260910-1638' "/tmp/$page"
            echo "$page OK"
          done
