name: KPI dashboard safety and publish check
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'src/index.js'
      - 'src/worker.js'
      - 'test/smoke.mjs'
      - '.github/workflows/kpi-dashboard-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify worker syntax and dashboard data without PII
        shell: bash
        run: |
          set -euo pipefail
          node test/smoke.mjs
          node --check src/worker.js
          node <<'JS'
          const fs=require('fs'),assert=require('assert');
          const d=JSON.parse(fs.readFileSync('dashboard/latest.json','utf8'));
          const html=fs.readFileSync('dashboard/index.html','utf8');
          assert.equal(d.schemaVersion,1);
          assert.equal(d.sites.length,3);
          assert(d.ga4Series.length>0 && d.gscSeries.length>0);
          assert(d.events.corp[3]===null && d.events.hoiku[3]===null && d.events.after[3]===null);
          assert(html.includes('/admin/kpi/data') && html.includes('__NONCE__'));
          const forbidden=/(?:BEGIN\s+(?:RSA|OPENSSH|PRIVATE)\s+KEY|MAKE_API_TOKEN\s*=|GMAIL_PASSWORD\s*=|Bearer\s+\S{15,})/i;
          assert(!forbidden.test(JSON.stringify(d)),'possible secret detected');
          console.log('dashboard safety/schema checks: PASS');
          JS
      - name: Check that the live KPI login preserves the destination
        shell: bash
        run: |
          set -euo pipefail
          base='https://trioland-social-publisher.mygate-jp.workers.dev'
          for attempt in $(seq 1 12); do
            code=$(curl -sS --max-time 10 -o /dev/null -D /tmp/kpi-headers -w '%{http_code}' "$base/admin/kpi" || true)
            if [ "$code" = 302 ] && tr -d '\r' </tmp/kpi-headers | grep -Fqi 'location: https://trioland-social-publisher.mygate-jp.workers.dev/admin/access?return_to=/admin/kpi'; then
              echo 'Live KPI login preserves its destination'; exit 0
            fi
            [ "$attempt" = 12 ] || sleep 10
          done
          echo '::error::Live KPI login destination could not be verified.'
          exit 1
