# サイトのHTMLと写真を生成してコミットする。
#
# なぜ生成してコミットするのか:
#   Cloudflare Workers は site/ をそのまま静的アセットとして配信するため、
#   最終成果物がリポジトリに入っている必要がある。さらに、バイナリをテキストの
#   コミットAPI経由で入れると壊れる（過去に15,000バイトで切り詰められたJPEGが
#   コミットされ、本番がbroken-imageになった）。画像は必ずこのワークフローか
#   git push で入れること。
#
# 入力:
#   build_site.py             … 全ページのHTML / robots.txt / sitemap.xml
#   site/assets/photo-src/    … 全写真の生成元（base64テキスト＋SHA-256）
#
# 2026-09-15: 旧 tools/build_photos.py は引退。あれは 400x300 のスプライトから
# 写真を引き伸ばしていたため必ず眠い絵になった。いまは高解像度の原本から
# 作った WebP を photo-src に置いており、CI はそれを復元するだけでよい。
name: Build site
on:
  push:
    branches: [main]
    paths:
      - 'build_site.py'
      - 'site/assets/photo-src/**'
      - 'tools/decode_photos.py'
      - 'tools/verify_photos.py'
      - '.github/workflows/build-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: python3 -m pip install --quiet pillow

      - name: Restore photos committed as base64 (checksum verified)
        run: python3 tools/decode_photos.py

      - name: Generate pages
        run: python3 build_site.py

      # 撤去は検証より先に行うこと。
      # 退役した壊れたJPEG（例: Codexが入れた 7,470 バイトの komazawa-exterior.jpg）が
      # 残っていると、それ自体が検証で引っかかってビルドが止まる。
      # 撤去してから、実際に配信するファイルだけを検証する。
      - name: Remove retired photo-pipeline assets
        run: |
          set -euo pipefail
          # 壊れたJPEG・座標定義の無いスプライト・base64ローダーの残骸を撤去する。
          # site/assets/photos-b64-v5/ は現行の生成元なので残すこと。
          legacy=(
            site/assets/umegaoka.jpg
            site/assets/child1.jpg
            site/assets/child2.jpg
            site/assets/photos.jpg
            site/assets/photos-v2.jpg
            site/assets/photos-v4.webp.b64
            site/assets/photo-loader.js
            site/assets/photo-policy-v2.js
            site/assets/placeholder-test.txt
            site/assets/photo-fallback.txt
            site/assets/top-images-note.txt
            site/assets/photos-final-marker.txt
            site/assets/photos-b64-v2
            site/.deploy-marker.txt
            site/umegaoka.jpg
            site/assets/photos/exterior.jpg
            site/assets/photos/komazawa-exterior.jpg
            site/assets/photos/life-room.jpg
            site/assets/photos/life-play.jpg
            site/assets/photos/life-toys.jpg
            site/assets/photos/life-nature.jpg
            site/assets/photos/life-table.jpg
            site/assets/photos/life-summer.jpg
            site/assets/photos/life-water.jpg
            site/assets/photos-b64-v5
            tools/build_photos.py
          )
          for f in "${legacy[@]}"; do
            if [ -e "$f" ]; then git rm -r --quiet "$f"; echo "removed $f"; fi
          done

      - name: Show what the build produced
        if: always()
        run: |
          {
            echo '### site/assets/photos'
            echo '```'
            ls -la site/assets/photos/ 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify every photo decodes end to end
        run: python3 tools/verify_photos.py

      - name: Verify no page references the retired photo pipeline
        run: |
          set -euo pipefail
          ! grep -rl 'sprite-photo\|photo-policy-v2\|photos-b64-v5/' site/*.html
          echo 'pages are clean'

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site/ tools/
          if git diff --cached --quiet; then echo 'site already current'; exit 0; fi
          git commit -m 'Build Trioland site (pages + photos) and drop retired assets'
          git push
