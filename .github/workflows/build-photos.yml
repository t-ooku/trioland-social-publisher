# サイトのHTMLと写真を生成してコミットする。
#
# なぜ生成してコミットするのか:
#   Cloudflare Workers は site/ をそのまま静的アセットとして配信するため、
#   最終成果物がリポジトリに入っている必要がある。さらに、バイナリをテキストの
#   コミットAPI経由で入れると壊れる（過去に15,000バイトで切り詰められたJPEGが
#   コミットされ、本番がbroken-imageになった）。画像は必ずこのワークフローか
#   git push で入れること。
#
# 入力:
#   build_site.py             … 全ページのHTML / robots.txt / sitemap.xml
#   tools/build_photos.py     … site/assets/photos/*.jpg
#   site/assets/photos-b64-v5 … 写真の生成元（テキスト）
name: Build site
on:
  push:
    branches: [main]
    paths:
      - 'build_site.py'
      - 'tools/build_photos.py'
      - 'site/assets/photos-b64-v5/**'
      - '.github/workflows/build-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: python3 -m pip install --quiet pillow

      - name: Generate photos
        run: python3 tools/build_photos.py

      - name: Generate pages
        run: python3 build_site.py

      - name: Verify every photo decodes end to end
        run: |
          set -euo pipefail
          for f in site/assets/photos/*.jpg; do
            s=$(stat -c%s "$f")
            test "$s" -gt 20000 || { echo "$f too small ($s)"; exit 1; }
            file -b "$f" | grep -qi jpeg
            python3 -c "import sys;from PIL import Image;im=Image.open(sys.argv[1]);im.load();print(sys.argv[1],im.size,'OK')" "$f"
          done

      - name: Verify no page references the retired photo pipeline
        run: |
          set -euo pipefail
          ! grep -rl 'sprite-photo\|photo-policy-v2\|photos-b64-v5/' site/*.html
          echo 'pages are clean'

      - name: Remove retired photo-pipeline assets
        run: |
          set -euo pipefail
          # 壊れたJPEG・座標定義の無いスプライト・base64ローダーの残骸を撤去する。
          # site/assets/photos-b64-v5/ は現行の生成元なので残すこと。
          legacy=(
            site/assets/umegaoka.jpg
            site/assets/child1.jpg
            site/assets/child2.jpg
            site/assets/photos.jpg
            site/assets/photos-v2.jpg
            site/assets/photos-v4.webp.b64
            site/assets/photo-loader.js
            site/assets/photo-policy-v2.js
            site/assets/placeholder-test.txt
            site/assets/photo-fallback.txt
            site/assets/top-images-note.txt
            site/assets/photos-final-marker.txt
            site/assets/photos-b64-v2
            site/.deploy-marker.txt
            site/umegaoka.jpg
          )
          for f in "${legacy[@]}"; do
            if [ -e "$f" ]; then git rm -r --quiet "$f"; echo "removed $f"; fi
          done

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site/
          if git diff --cached --quiet; then echo 'site already current'; exit 0; fi
          git commit -m 'Build Trioland site (pages + photos) and drop retired assets'
          git push
