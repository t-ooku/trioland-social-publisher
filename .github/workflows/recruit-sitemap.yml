name: Preserve recruitment SEO discovery
on:
  push:
    branches: [main]
    paths:
      - 'site/recruit/**'
      - '.github/workflows/recruit-sitemap.yml'
  workflow_run:
    workflows: ['Build site']
    types: [completed]

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ensure recruitment articles are linked and in sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html, re

          base='https://hoiku.triocareer.jp'
          recruit=Path('site/recruit')

          # Sitemap: make every recruitment article discoverable.
          sm=Path('site/sitemap.xml')
          s=sm.read_text(encoding='utf-8')
          existing=set(re.findall(r'<loc>(.*?)</loc>',s))
          missing=[]
          for f in sorted(recruit.glob('*.html')):
              if f.name=='index.html':
                  continue
              url=f'{base}/recruit/{f.name}'
              if url not in existing:
                  missing.append(f'<url><loc>{url}</loc><changefreq>monthly</changefreq><priority>0.5</priority></url>')
          if missing:
              s=s.replace('</urlset>',''.join(missing)+'</urlset>')
              sm.write_text(s,encoding='utf-8')
              print('sitemap: added',len(missing),'URLs')
          else:
              print('sitemap already complete')

          # Recruitment index: append a card for every article not yet linked.
          idx=Path('site/recruit/index.html')
          t=idx.read_text(encoding='utf-8')
          marker='</div><div class="note">'
          cards=[]
          for f in sorted(recruit.glob('*.html')):
              if f.name=='index.html':
                  continue
              href=f'/recruit/{f.name}'
              if f'href="{href}"' in t:
                  continue
              src=f.read_text(encoding='utf-8')
              mh=re.search(r'<h1>(.*?)</h1>',src,re.S|re.I)
              md=re.search(r'<meta\s+name="description"\s+content="([^"]*)"',src,re.I)
              if not mh:
                  continue
              title=re.sub(r'<[^>]+>','',mh.group(1)).strip()
              desc=(md.group(1).strip() if md else 'トリオランドの採用・求人選びに役立つガイド。')
              if len(desc)>72:
                  desc=desc[:72]+'…'
              cards.append(f'<a class="card" href="{href}"><b>{html.escape(title)}</b><span>{html.escape(desc)}</span></a>')
          if cards:
              if marker not in t:
                  raise SystemExit('recruit index marker not found')
              t=t.replace(marker,''.join(cards)+marker,1)
              idx.write_text(t,encoding='utf-8')
              print('recruit index: added',len(cards),'cards')
          else:
              print('recruit index already complete')
          PY
      - name: Point recruit links to this site's recruit page
        # トリオキャリア HP の採用ページは時給が東京都の最低賃金を下回ったままなので、リンクしない（2026-10-09 オーナーの指示）。
        # 求人ガイドを直接 site/recruit/ に足したときも、ここで園の採用ページ（/recruit.html#jobs）へ付け替える。
        shell: bash
        run: |
          perl -0pi -e 's{<a href="https://www\.triocareer\.jp/company/recruit/?"[^>]*>[^<]*</a>}{<a href="/recruit.html#jobs">トリオランドの採用情報</a>}g' site/*.html site/recruit/*.html
          perl -pi -e 's{https://www\.triocareer\.jp/company/recruit/?}{/recruit.html#jobs}g' site/*.html site/recruit/*.html
          ! grep -rl 'triocareer\.jp/company/recruit' site/*.html site/recruit/*.html
      - name: Commit discovery files if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/sitemap.xml site/*.html site/recruit/*.html
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve recruitment SEO discovery links'
          git push
