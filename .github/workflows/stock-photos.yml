# トリオキャリア HP 試作版の採用バナー用に、フリー素材（Unsplash ライセンス・無料）の候補写真を取ってくる（2026-10-16 オーナー「フリー素材で」）。
# corp-mirror ブランチだけで動く。main には入れない。（v3：unsplash.com はボット対策で 401 になるため、画像 CDN から直接取る）
name: Stock photo candidates
on:
  push:
    branches: [corp-mirror]
    paths: ['.github/workflows/stock-photos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch candidates
        shell: bash
        run: |
          python3 -m pip install --quiet requests pillow
          python3 - <<'PY'
          import os, re, json, io, html
          import requests
          from PIL import Image, ImageDraw
          IDS = {"wnpf3Q5pkXA": "photo-1766066014237-00645c74e9c6", "GtWJvhttYmg": "photo-1790597035491-1d310389a733",
                 "UCU1qi1cXjE": "photo-1790597035469-ddca48ece28f", "ZYJX7UjOZyo": "photo-1790597035527-a5137a3e20f2",
                 "APjRQ59peUg": "photo-1758691737605-69a0e78bd193", "GNj902mGGH4": "photo-1758873268223-f61976493498",
                 "sQcFcFImSg8": "photo-1772419130717-e0630e3e4f28", "gAfLQ3YIlUA": "photo-1786292949404-084cbd10c7b1",
                 "PlcVlbzEgOc": "photo-1786293424429-c181dea1d5f3", "zFKOZ2Udk6I": "photo-1544772711-57da9c7368fa",
                 "9Fi8p2qOPNo": "photo-1770096679844-57ca92c2b64b"}
          OUT = "corp-mirror/stock"; os.makedirs(OUT, exist_ok=True)
          S = requests.Session(); S.headers["User-Agent"] = "Mozilla/5.0 (X11; Linux x86_64) Chrome/124 Safari/537.36"
          meta = {}; thumbs = []
          def get_img(i):
              u = f"https://images.unsplash.com/{IDS[i]}?w=1600&q=85&fm=jpg"
              r = S.get(u, timeout=60)
              log = [f"cdn {r.status_code} {r.headers.get('content-type','')}"]
              return (r.content if r.status_code == 200 and r.headers.get("content-type", "").startswith("image") else None), log, IDS[i]
          for i in IDS:
              try:
                  data, log, title = get_img(i)
                  print(i, log)
                  if not data:
                      meta[i] = {"error": log}; continue
                  im = Image.open(io.BytesIO(data)).convert("RGB")
                  im.thumbnail((1600, 1600))
                  im.save(f"{OUT}/{i}.jpg", "JPEG", quality=86)
                  meta[i] = {"title": title, "size": im.size, "log": log}
                  th = im.copy(); th.thumbnail((380, 300)); thumbs.append((i, th))
              except Exception as e:
                  print("fail", i, e); meta[i] = {"error": str(e)}
          json.dump(meta, open(f"{OUT}/meta.json", "w"), ensure_ascii=False, indent=1)
          cols = 4; W = cols * 390; H = max(1, (len(thumbs) + cols - 1) // cols) * 330
          sheet = Image.new("RGB", (W, H), "white"); dr = ImageDraw.Draw(sheet)
          for k, (i, th) in enumerate(thumbs):
              x, y = (k % cols) * 390, (k // cols) * 330
              sheet.paste(th, (x + 5, y + 5)); dr.text((x + 8, y + 310), f"{k+1}. {i}", fill="black")
          sheet.save(f"{OUT}/sheet.jpg", quality=85)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corp-mirror/stock
          git diff --cached --quiet && exit 0
          git commit -q -m 'Stock photo candidates (Unsplash) for the corporate recruit banner'
          git push
