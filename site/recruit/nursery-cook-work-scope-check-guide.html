<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保育園調理スタッフの担当範囲を確認するとき｜調理以外の業務は面接で確認</title><meta name="description" content="保育園調理スタッフ求人で、給食・おやつ調理以外の担当範囲を確認するポイントを整理します。"><link rel="canonical" href="https://hoiku.triocareer.jp/recruit/nursery-cook-work-scope-check-guide.html"></head><body><main><h1>保育園調理スタッフの担当範囲を確認するとき</h1><p>トリオキャリア公式採用情報では、調理スタッフの業務は保育施設でのお昼ご飯やおやつの調理と掲載されています。</p><h2>調理以外の担当範囲は確認が必要</h2><p>発注、在庫管理、清掃、記録、献立作成などを誰が担当するかは公開情報では分かりません。応募時には1日の業務の流れと役割分担を確認しましょう。</p><h2>未経験も可と掲載</h2><p>管理栄養士・栄養士・調理士資格・経験者優遇とあわせて、未経験も可と案内されています。未経験者向けの具体的な研修内容は公開情報では確認できません。</p><p><a href="https://www.triocareer.jp/company/recruit/">公式採用情報を確認する</a></p></main></body></html>
