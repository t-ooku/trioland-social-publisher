<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保育士求人で年間行事を確認するとき｜イベントと準備負担を分けて見る</title><meta name="description" content="保育士求人で年間行事を重視する方向けに、園のイベント情報と職員の準備範囲を分けて確認するポイントを整理します。"><link rel="canonical" href="https://hoiku.triocareer.jp/recruit/hoikushi-annual-events-workload-check-guide.html"></head><body><main><h1>保育士求人で年間行事を確認するとき</h1><p>トリオランド駒沢大学園の公式施設ページでは、季節に合わせたイベントを行っていると掲載されています。</p><h2>行事があることと担当範囲は別</h2><p>どの行事を誰が企画するのか、準備をどのように分担するのかは公開情報では分かりません。応募時には年間予定だけでなく、職員の担当方法も確認しましょう。</p><h2>土日祝イベントの扱いも確認する</h2><p>公式施設ページには土日祝に保護者自由参加型のイベントを開く場合があると記載されています。職員の参加方法や勤務扱いは公開情報では確認できません。</p><p><a href="https://www.triocareer.jp/company/recruit/">公式採用情報を確認する</a></p></main></body></html>
